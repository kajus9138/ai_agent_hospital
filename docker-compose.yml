# PostgreSQL local para as threads. Credenciais iguais ao DATABASE_URL padrão do .env.example.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_agent_hospital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_agent_hospital"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
